name: Build Android APK

# Build policy:
# - Code/MD edits do not automatically start APK builds.
# - Build only after user approval via workflow_dispatch.
# - This avoids duplicate builds while development changes are accumulating.
on:
  workflow_dispatch:

concurrency:
  group: ai-os-android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files when missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.juinim .
            rm -f test/widget_test.dart
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI_OS-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

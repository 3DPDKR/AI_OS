name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-apk.yml']
  workflow_dispatch:
concurrency:
  group: ai-os-android-apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Clean generated state
        run: rm -rf android build .dart_tool pubspec.lock
      - name: Generate Android fresh
        run: flutter create --platforms=android --org com.juinim . && rm -f test/widget_test.dart
      - name: Configure Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/AndroidManifest.xml'); s=p.read_text(); p.write_text(re.sub(r'android:label="[^"]*"','android:label="AI OS"',s))
          p=Path('android/app/build.gradle.kts'); s=p.read_text(); s=re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion','compileSdk = 36',s); s=re.sub(r'compileSdk\s*=\s*\d+','compileSdk = 36',s); p.write_text(s)
          PY
      - name: Resolve dependencies fresh
        run: flutter pub get
      - name: Ensure file_picker is absent
        run: '! flutter pub deps --style=compact | grep -q "file_picker"'
      - name: Analyze
        run: flutter analyze
      - name: Build APK
        run: flutter build apk --debug
      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-debug.apk && ls -lh build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AI_OS-v0.2.0-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

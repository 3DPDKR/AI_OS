name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-apk.yml']
  workflow_dispatch:
concurrency:
  group: ai-os-android-apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Generate Android and native document picker
        run: |
          rm -rf android build .dart_tool pubspec.lock
          flutter create --platforms=android --org com.juinim .
          rm -f test/widget_test.dart
          cat > android/app/src/main/kotlin/com/juinim/ai_os/MainActivity.kt <<'KT'
          package com.juinim.ai_os
          import android.app.Activity
          import android.content.Intent
          import android.provider.OpenableColumns
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          class MainActivity: FlutterActivity() {
            private val channel="ai_os/native"; private val request=7001; private var pending: MethodChannel.Result?=null
            override fun configureFlutterEngine(engine: FlutterEngine){super.configureFlutterEngine(engine);MethodChannel(engine.dartExecutor.binaryMessenger,channel).setMethodCallHandler{call,result->if(call.method=="openDocument"){pending=result;val i=Intent(Intent.ACTION_OPEN_DOCUMENT).apply{addCategory(Intent.CATEGORY_OPENABLE);type="*/*";addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)};startActivityForResult(i,request)}else result.notImplemented()}}
            override fun onActivityResult(req:Int,res:Int,data:Intent?){super.onActivityResult(req,res,data);if(req!=request)return;val r=pending;pending=null;if(res!=Activity.RESULT_OK||data?.data==null){r?.success(null);return};val u=data.data!!;try{contentResolver.takePersistableUriPermission(u,Intent.FLAG_GRANT_READ_URI_PERMISSION)}catch(_:Exception){};var name="document";var size:Long=-1;contentResolver.query(u,null,null,null,null)?.use{c->val ni=c.getColumnIndex(OpenableColumns.DISPLAY_NAME);val si=c.getColumnIndex(OpenableColumns.SIZE);if(c.moveToFirst()){if(ni>=0)name=c.getString(ni);if(si>=0&&!c.isNull(si))size=c.getLong(si)}};r?.success(mapOf("uri" to u.toString(),"name" to name,"size" to size))}
          }
          KT
      - name: Configure app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/AndroidManifest.xml');s=p.read_text();s=re.sub(r'android:label="[^"]*"','android:label="AI OS"',s);s=s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">','<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n<uses-permission android:name="android.permission.CAMERA"/>\n<uses-permission android:name="android.permission.INTERNET"/>');p.write_text(s)
          p=Path('android/app/build.gradle.kts');s=p.read_text();s=re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion','compileSdk = 36',s);s=re.sub(r'compileSdk\s*=\s*\d+','compileSdk = 36',s);p.write_text(s)
          PY
      - name: Validate
        run: flutter pub get && flutter analyze
      - name: Build APK
        run: flutter build apk --debug
      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-debug.apk && ls -lh build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AI_OS-v0.3.0-document-voice-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

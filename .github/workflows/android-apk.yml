name: Build Android APK

# Build policy: this commit is the explicitly approved build trigger.
# After this run, restore workflow_dispatch-only mode before further feature edits.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: ai-os-android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files when missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.juinim .
            rm -f test/widget_test.dart
          fi

      - name: Set Android app label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          import re
          s = re.sub(r'android:label="[^"]*"', 'android:label="AI OS"', s)
          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI_OS-v0.2.0-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
